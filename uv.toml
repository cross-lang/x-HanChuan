# ============================================================
# uv 项目配置
# ============================================================
# uv 是本项目唯一的包管理器与任务运行器。
#
# 常用命令:
#   uv sync               # 同步依赖（自动创建 .venv）
#   uv sync --dev          # 同步依赖（含开发依赖）
#   uv run x-HanChuan serve  # 在项目环境中运行命令
#   uv run pytest          # 运行测试
#   uv lock                # 生成/更新 uv.lock
# ============================================================

