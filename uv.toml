# ============================================================
# uv 配置文件
# ============================================================
# uv 是一个高性能 Python 包管理器（Rust 编写），
# 兼容 pip，安装速度快 10-100 倍。
#
# 常用命令:
#   uv venv                    # 创建虚拟环境
#   uv pip install -e ".[dev]" # 安装项目（含开发依赖）
#   uv pip compile pyproject.toml -o requirements.lock  # 锁定依赖版本
# ============================================================

# PyPI 镜像源（国内加速，按需取消注释）
# [tool.uv]
# index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
