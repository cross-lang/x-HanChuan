# ============================================================
# x-HanChuan Docker Compose
# ============================================================
# 用法:
#   docker compose up -d            # 启动（后台）
#   docker compose up --build       # 重新构建并启动
#   docker compose logs -f          # 查看日志
#   docker compose down             # 停止并移除容器
# ============================================================

services:
  x-HanChuan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x-HanChuan
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOGGING_FORMAT=json
    volumes:
      # 持久化日志
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
